[package]
name = "torrent-search"
version = "0.8.3"
edition = "2024"
publish = false
description = "Local torrent search with independent source adapters"

[[bin]]
name = "torrentx"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
chrono = "0.4"
html-escape = "0.2"
regex = "1"
percent-encoding = "2"
encoding_rs = "0.8"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip", "charset", "cookies", "socks", "json", "multipart"] }
scraper = "0.24"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "sync", "time", "signal", "fs", "net"] }
tokio-util = "0.7"
url = "2"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

